        - heading "Why the line is there" [level=3] [ref=e385]
        - paragraph [ref=e386]: The open core is genuinely useful on its own. But three things sit permanently on the paid side — not as withheld features, but because they can only exist with a vendor behind them.
        - generic [ref=e387]:
          - generic [ref=e388]:
            - generic [ref=e389]: "01"
            - heading "Attestation needs a third party" [level=4] [ref=e390]
            - paragraph [ref=e391]: A regulator accepts evidence a vendor attests to — not logs you generated about yourself. You can self-host the audit trail forever; you cannot self-issue the attestation that makes it count in an exam.
          - generic [ref=e392]:
            - generic [ref=e393]: "02"
            - heading "Accuracy you can put in a contract" [level=4] [ref=e394]
            - paragraph [ref=e395]: The open detectors are honest baselines. Tuned detection with measured false-negative rates — and a vendor liable for them — is what survives model-risk review under SR 11-7. Accountability isn't a feature you can fork.
          - generic [ref=e396]:
            - generic [ref=e397]: "03"
            - heading "Compliance is a service, not a build" [level=4] [ref=e398]
            - paragraph [ref=e399]: SOC 2, data residency, evidence retention, SLA and support are continuing obligations someone carries on your behalf — not code you run once. That ongoing carry is the line, and it's what the price buys.
