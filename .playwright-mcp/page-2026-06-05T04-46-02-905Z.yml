    - generic [ref=e20]:
      - generic [ref=e21]:
        - generic [ref=e22]: Security
        - generic [ref=e23]: Architecture & posture
      - generic [ref=e24]:
        - heading "Built to be trusted by people who trust nothing." [level=1] [ref=e25]
        - paragraph [ref=e26]: Banks don't buy diagrams — they buy controls, isolation, auditability, and evidence. Here's how Vaultex is constructed to earn a pilot.
      - generic [ref=e27]:
        - text: The trust boundary
        - paragraph [ref=e28]: Raw data stays inside. The model provider lives outside. The line between them is enforced, not assumed.
        - paragraph [ref=e29]: your network ─▶ classify ─▶ tokenize ─▶ [ boundary ] ─▶ LLM ─▶ screen ─▶ detokenize (by role) ─▶ audit
      - generic [ref=e30]:
        - generic [ref=e31]:
          - img [ref=e32]
          - heading "PII never leaves un-tokenized" [level=3] [ref=e35]
          - paragraph [ref=e36]: Detected identifiers are tokenized at the gateway before any prompt is forwarded. With local models, nothing leaves your network at all. The token vault is encrypted at rest and never transmitted.
        - generic [ref=e37]:
          - img [ref=e38]
          - heading "Tamper-evident audit chain" [level=3] [ref=e43]
          - paragraph [ref=e44]: Every governance decision is hash-chained into an append-only ledger. Each entry links to the previous one; edits or deletions break the chain and are blocked at the database (WORM).
        - generic [ref=e45]:
          - img [ref=e46]
          - heading "Role-based disclosure" [level=3] [ref=e49]
          - paragraph [ref=e50]: Detokenization is enforced per role at the token level — a junior analyst and a VP never see the same response. Access decisions are themselves audited.
        - generic [ref=e51]:
          - img [ref=e52]
          - heading "Zero-trust tenant isolation" [level=3] [ref=e57]
          - paragraph [ref=e58]: Every record is tenant-scoped and every query is filtered; row-level security enforces it at the database as defense-in-depth.
        - generic [ref=e59]:
          - img [ref=e60]
          - heading "Secrets & key management" [level=3] [ref=e63]
          - paragraph [ref=e64]: Signing keys, provider credentials, and the token-encryption key live in a secrets provider, never in source. Rotation is key-id based with a grace window so it never invalidates in-flight sessions.
        - generic [ref=e65]:
          - img [ref=e66]
          - heading "Deploy on your terms" [level=3] [ref=e77]
          - paragraph [ref=e78]: Self-host with Docker, run in a private VPC, or keep everything on-prem with local models. No data egress required for the core privacy guarantee.
